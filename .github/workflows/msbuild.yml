name: Build Velocity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Development
          - Ship

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Show tool versions
        shell: powershell
        run: |
          Write-Host "=== MSBuild ==="
          msbuild -version

          Write-Host "=== Clang ==="
          clang-cl --version

      - name: Build Velocity
        shell: powershell
        run: |
          msbuild "cs2\velocity-cs2\velocity-cs2.vcxproj" `
            /m `
            /t:Rebuild `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:LLVMToolsVersion=20

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "=== cs2/bin ==="

          if (Test-Path "cs2\bin") {
            Get-ChildItem "cs2\bin" -Recurse |
              Select-Object FullName, Length
          }
          else {
            Write-Error "cs2/bin directory was not created."
          }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-${{ matrix.configuration }}-x64
          path: cs2/bin/*.dll
          if-no-files-found: error
