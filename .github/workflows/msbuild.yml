name: Build Velocity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Development
          - Ship

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install LLVM 19
        shell: powershell
        run: |
          choco install llvm `
            --version=19.1.7 `
            --allow-downgrade `
            --force `
            -y `
            --no-progress

      - name: Check toolchain
        shell: powershell
        run: |
          Write-Host "=== MSBuild ==="
          msbuild -version

          Write-Host "=== Clang ==="
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

          Write-Host "=== LLD ==="
          & "C:\Program Files\LLVM\bin\lld-link.exe" --version

      - name: Build Velocity
        shell: powershell
        run: |
          $arguments = @(
            "cs2\velocity-cs2\velocity-cs2.vcxproj"
            "/m"
            "/t:Rebuild"
            "/v:normal"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/p:LLVMInstallDir=C:\Program Files\LLVM"
            "/p:LLVMToolsVersion=19.1.7"
          )

          & msbuild @arguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Show build output
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Build output ==="

          if (Test-Path "cs2\bin") {
            Get-ChildItem "cs2\bin" -Recurse |
              Select-Object FullName, Length
          }
          else {
            Write-Host "cs2/bin does not exist"
          }

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-${{ matrix.configuration }}-x64
          path: cs2/bin/*.dll
          if-no-files-found: error
