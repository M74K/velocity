name: Build Velocity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find Visual Studio projects
        shell: powershell
        run: |
          Write-Host "Solutions:"
          Get-ChildItem -Path . -Recurse -Filter *.sln |
            Select-Object FullName

          Write-Host "Projects:"
          Get-ChildItem -Path . -Recurse -Filter *.vcxproj |
            Select-Object FullName

      - name: Build
        shell: powershell
        run: |
          $sln = Get-ChildItem -Path . -Recurse -Filter *.sln | Select-Object -First 1

          if ($sln) {
              Write-Host "Building solution:"
              Write-Host $sln.FullName

              msbuild $sln.FullName `
                /m `
                /p:Configuration=Release `
                /p:Platform=x64
          }
          else {
              $proj = Get-ChildItem -Path . -Recurse -Filter *.vcxproj | Select-Object -First 1

              if (-not $proj) {
                  throw "No .sln or .vcxproj found"
              }

              Write-Host "Building project:"
              Write-Host $proj.FullName

              msbuild $proj.FullName `
                /m `
                /p:Configuration=Release `
                /p:Platform=x64
          }

      - name: Find build outputs
        shell: powershell
        run: |
          Write-Host "DLL files:"
          Get-ChildItem -Path . -Recurse -Filter *.dll |
            Select-Object FullName, Length

          Write-Host "EXE files:"
          Get-ChildItem -Path . -Recurse -Filter *.exe |
            Select-Object FullName, Length

      - name: Collect build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact

          Get-ChildItem -Path . -Recurse -Include *.dll,*.exe |
            Where-Object {
              $_.FullName -notmatch '\\artifact\\'
            } |
            Copy-Item -Destination artifact

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Release-x64
          path: artifact/*
          if-no-files-found: error
